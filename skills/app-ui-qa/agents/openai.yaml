interface:
  display_name: "App UI QA"
  short_description: "Case-first mobile smoke and new-feature exploratory QA"
  default_prompt: "Use $app-ui-qa to read the active smoke or feature rules, convert supplied feature cases when needed, run the Android adb-only or iPhone Mirroring path, collect crash diagnostics, produce a screenshot-and-log-backed self-contained HTML report, and always upload and verify it through the QA member's signed-in Chrome session."
